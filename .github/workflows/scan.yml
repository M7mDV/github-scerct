name: 🔍 Secret Leak Scanner + Discord Alert

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  # ════════════════════════════════════════
  # ✏️ اكتب هنا الـ URL الكامل للـ Repo:
  # ════════════════════════════════════════
  TARGET_REPO: "https://github.com/slackhq/nebula"
  # ════════════════════════════════════════

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ─── 1. حساب تاريخ آخر سنتين ───
      - name: Calculate 2-Year Cutoff
        id: date
        run: |
          CUTOFF=$(date -d "2 years ago" +%Y-%m-%d)
          echo "cutoff=$CUTOFF" >> $GITHUB_OUTPUT
          echo "🔍 Scanning since: $CUTOFF"

      # ─── 2. تثبيت TruffleHog ───
      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog --version

      # ─── 3. استخراج اسم الـ Repo ───
      - name: Parse Repo Info
        id: parse
        run: |
          REPO_URL="${{ env.TARGET_REPO }}"
          REPO_NAME=$(basename "$REPO_URL")
          REPO_SLUG=$(echo "$REPO_URL" | sed 's|https://github.com/||')
          echo "name=$REPO_NAME"   >> $GITHUB_OUTPUT
          echo "slug=$REPO_SLUG"   >> $GITHUB_OUTPUT
          echo "url=${REPO_URL}.git" >> $GITHUB_OUTPUT
          echo "📦 Target: $REPO_SLUG"

      # ─── 4. فحص الـ Repo ───
      - name: Scan Repo for Secrets
        id: scan
        run: |
          CUTOFF="${{ steps.date.outputs.cutoff }}"
          REPO_NAME="${{ steps.parse.outputs.name }}"
          CLONE_URL="${{ steps.parse.outputs.url }}"
          RESULTS_FILE="trufflehog-results.jsonl"

          echo "🔎 Cloning: $CLONE_URL"
          git clone --bare --depth=1 "$CLONE_URL" "$RUNNER_TEMP/$REPO_NAME"

          echo "🔎 Scanning..."
          trufflehog git "file://$RUNNER_TEMP/$REPO_NAME" \
            --since-commit="$CUTOFF" \
            --json \
            --no-update \
            --results=verified,unknown \
            --force-skip-binaries \
            > "$RESULTS_FILE" 2>/dev/null || true

          TOTAL=$(wc -l < "$RESULTS_FILE" | tr -d ' ')
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          echo "═══════════════════════════════════════"
          echo "🎯 Total secrets found: $TOTAL"
          echo "═══════════════════════════════════════"

      # ─── 5. إعداد رسالة Discord ───
      - name: Prepare Discord Alert
        if: steps.scan.outputs.total != '0'
        run: |
          SLUG="${{ steps.parse.outputs.slug }}"
          COUNT="${{ steps.scan.outputs.total }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CUTOFF="${{ steps.date.outputs.cutoff }}"

          jq -n \
            --arg slug "$SLUG" \
            --arg count "$COUNT" \
            --arg url "$RUN_URL" \
            --arg repo_url "${{ env.TARGET_REPO }}" \
            --arg cutoff "$CUTOFF" \
            '{
              "username": "🔐 Secret Scanner Bot",
              "content": "@here 🚨 Secrets detected!",
              "embeds": [{
                "title": "🔍 Scan Results: " + $slug,
                "description": "Found **" + $count + "** potential secret(s)",
                "color": 15158332,
                "fields": [
                  {
                    "name": "📁 Repository",
                    "value": "[" + $slug + "](" + $repo_url + ")",
                    "inline": true
                  },
                  {
                    "name": "📅 Scan Period",
                    "value": "Since " + $cutoff,
                    "inline": true
                  },
                  {
                    "name": "🔗 Workflow Run",
                    "value": "[View Details](" + $url + ")",
                    "inline": false
                  }
                ],
                "footer": { "text": "Powered by TruffleHog" },
                "timestamp": now | todate
              }]
            }' > discord-payload.json

      # ─── 6. إرسال لـ Discord ───
      - name: Send Discord Alert
        if: steps.scan.outputs.total != '0'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @discord-payload.json
          echo "📨 Discord alert sent!"

      # ─── 7. رفع النتائج ───
      - name: Upload Results
        if: steps.scan.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: secrets-found-${{ steps.parse.outputs.name }}
          path: trufflehog-results.jsonl

      # ─── 8. فشل لو لقينا secrets ───
      - name: Alert on Secrets Found
        if: steps.scan.outputs.total != '0'
        run: |
          echo "::error::🚨 Found ${{ steps.scan.outputs.total }} secrets in ${{ steps.parse.outputs.slug }}!"
          exit 1
